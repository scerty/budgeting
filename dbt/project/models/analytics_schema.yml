version: 2

models:
  - name: dim_organization
    columns:
      - name: organization_id
        data_tests: [not_null, unique]

  - name: dim_country
    columns:
      - name: country_id
        data_tests: [not_null, unique]

  - name: dim_currency
    columns:
      - name: currency_id
        data_tests: [not_null, unique]
      - name: currency_code
        data_tests: [not_null, unique]

  - name: dim_fiscal_period
    columns:
      - name: fiscal_period_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id

  - name: dim_legal_entity
    columns:
      - name: legal_entity_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id

  - name: dim_cost_center
    columns:
      - name: cost_center_id
        data_tests: [not_null, unique]
      - name: legal_entity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_legal_entity')
                field: legal_entity_id

  - name: dim_profit_center
    columns:
      - name: profit_center_id
        data_tests: [not_null, unique]
      - name: legal_entity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_legal_entity')
                field: legal_entity_id

  - name: dim_business_unit
    columns:
      - name: business_unit_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id

  - name: dim_project
    columns:
      - name: project_id
        data_tests: [not_null, unique]
      - name: legal_entity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_legal_entity')
                field: legal_entity_id

  - name: dim_group_account
    columns:
      - name: group_account_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id

  - name: dim_entity_account
    columns:
      - name: entity_account_id
        data_tests: [not_null, unique]
      - name: legal_entity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_legal_entity')
                field: legal_entity_id

  - name: dim_scenario
    columns:
      - name: scenario_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id

  - name: dim_scenario_version
    columns:
      - name: scenario_version_id
        data_tests: [not_null, unique]
      - name: scenario_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_scenario')
                field: scenario_id

  - name: dim_budget_version
    columns:
      - name: budget_version_id
        data_tests: [not_null, unique]
      - name: budget_plan_id
        data_tests: [not_null]

  - name: dim_supplier
    columns:
      - name: supplier_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]

  - name: dim_tax_code
    columns:
      - name: tax_code_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]

  - name: fact_budget
    columns:
      - name: budget_line_id
        data_tests: [not_null, unique]
      - name: budget_version_id
        data_tests: [not_null]
      - name: organization_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organization')
                field: organization_id
      - name: fiscal_period_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fiscal_period')
                field: fiscal_period_id
      - name: amount
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: budget_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['draft', 'submitted', 'approved', 'rejected', 'closed']

  - name: fact_planning_driver_values
    columns:
      - name: driver_value_id
        data_tests: [not_null, unique]
      - name: planning_driver_id
        data_tests: [not_null]
      - name: fiscal_period_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fiscal_period')
                field: fiscal_period_id
      - name: value
        data_tests: [not_null]

  - name: fact_planning
    columns:
      - name: planning_fact_id
        data_tests: [not_null, unique]
      - name: calculation_run_id
        data_tests: [not_null]
      - name: organization_id
        data_tests: [not_null]
      - name: organization_code
        data_tests: [not_null]
      - name: scenario_version_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_scenario_version')
                field: scenario_version_id
      - name: scenario_version_code
        data_tests: [not_null]
      - name: fiscal_period_id
        data_tests: [not_null]
      - name: fiscal_period_code
        data_tests: [not_null]
      - name: fiscal_period_name
        data_tests: [not_null]
      - name: group_account_code
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: calculation_run_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['succeeded']

  - name: fact_invoices
    columns:
      - name: invoice_line_id
        data_tests: [not_null, unique]
      - name: invoice_id
        data_tests: [not_null]
      - name: organization_id
        data_tests: [not_null]
      - name: invoice_date
        data_tests: [not_null]
      - name: gross_amount
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]

  - name: fact_payments
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: allocated_amount
        data_tests: [not_null]
      - name: unallocated_amount
        data_tests: [not_null]

  - name: fact_encumbrances
    columns:
      - name: encumbrance_id
        data_tests: [not_null, unique]
      - name: organization_id
        data_tests: [not_null]
      - name: fiscal_period_id
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]

  - name: budget_vs_actual
    columns:
      - name: organization_id
        data_tests: [not_null]
      - name: organization_code
        data_tests: [not_null]
      - name: fiscal_period_id
        data_tests: [not_null]
      - name: fiscal_period_code
        data_tests: [not_null]
      - name: fiscal_period_name
        data_tests: [not_null]
      - name: group_account_code
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: budget_amount
        data_tests: [not_null]
      - name: actual_amount
        data_tests: [not_null]
      - name: variance_amount
        data_tests: [not_null]

  - name: budget_vs_actual_month
    columns:
      - name: organization_id
        data_tests: [not_null]
      - name: organization_code
        data_tests: [not_null]
      - name: fiscal_period_id
        data_tests: [not_null]
      - name: fiscal_period_code
        data_tests: [not_null]
      - name: month_start
        data_tests: [not_null]
      - name: month_key
        data_tests: [not_null]
      - name: group_account_code
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: budget_amount
        data_tests: [not_null]
      - name: actual_amount
        data_tests: [not_null]
      - name: variance_amount
        data_tests: [not_null]

  - name: exceptions_unmapped_expenses
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: exception_reason
        data_tests: [not_null]
      - name: source_model
        data_tests: [not_null]
      - name: discovered_at
        data_tests: [not_null]

  - name: exceptions_unmapped_accounts
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: exception_reason
        data_tests: [not_null]

  - name: exceptions_invalid_organization_links
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: exception_reason
        data_tests: [not_null]

  - name: exceptions_invalid_effective_assignments
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: exception_reason
        data_tests: [not_null]

  - name: exceptions_duplicate_source_records
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: duplicate_row_count
        data_tests: [not_null]

  - name: int_allocation_rules_effective
    columns:
      - name: allocation_rule_id
        data_tests: [not_null, unique]
      - name: total_allocation_percentage
        data_tests: [not_null]

  - name: int_journal_entries_balanced
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: balance_difference
        data_tests: [not_null]
