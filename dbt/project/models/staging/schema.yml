version: 2

models:
  - name: stg_branches
    description: Cleaned branch data
    columns:
      - name: branch_id
        data_tests:
          - not_null
          - unique

  - name: stg_departments
    description: Cleaned department data
    columns:
      - name: department_id
        data_tests:
          - not_null
          - unique

      - name: branch_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_branches')
                field: branch_id

      - name: updated_at
        data_tests:
          - not_null

  - name: stg_expenses
    description: Cleaned expense data
    columns:
      - name: expense_id
        data_tests:
          - not_null
          - unique

      - name: department_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id

      - name: created_at
        data_tests:
          - not_null

      - name: updated_at
        data_tests:
          - not_null

      - name: currency_code
        data_tests:
          - not_null

  - name: stg_journal_lines
    description: Cleaned ERPNext and other source general ledger journal lines
    columns:
      - name: journal_line_id
        data_tests:
          - not_null
          - unique

      - name: source_record_id
        data_tests:
          - not_null

      - name: source_line_id
        data_tests:
          - not_null

      - name: posting_date
        data_tests:
          - not_null

      - name: source_account_code
        data_tests:
          - not_null

      - name: currency_code
        data_tests:
          - not_null

      - name: debit_amount
        data_tests:
          - not_null

      - name: credit_amount
        data_tests:
          - not_null